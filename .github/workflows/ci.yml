name: CI

# Build + test + packaging validation on every push/PR. Publishing lives in release.yml
# (NuGet packages on v* tags); docs publishing lives in docs.yml.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The library multi-targets net8.0/net9.0/net10.0, so all three SDKs are needed to build and
      # run-test every TFM. The latest SDK (10) drives the build.
      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore YandexMusic.slnx

      - name: Build (Release)
        run: dotnet build YandexMusic.slnx -c Release --no-restore

      - name: Test (all TFMs)
        run: dotnet test YandexMusic.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/*.trx'
          if-no-files-found: ignore

      # Pack here too so a packaging break (missing README/icon, CS1591, etc.) fails CI, not release.
      # Only IsPackable=true projects are produced: YandexMusic and YandexMusic.DependencyInjection.
      # Built once (on Linux) — the packages are platform-agnostic (netX.0, no RID-specific assets).
      - name: Pack (validation only)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack YandexMusic.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: ignore

  # Build the sample player as a self-contained single-file CLI on every push and upload it as a
  # version-named workflow artifact. Two flavours ship: Windows (net*-windows TFM, real NAudio
  # playback) built on Windows, and Linux (plain net10.0 TFM, simulated audio) built on Ubuntu.
  player:
    name: Build player (${{ matrix.rid }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            tfm: net10.0-windows10.0.19041.0
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore samples/YandexMusic.Player/YandexMusic.Player.csproj -p:PlayerTargetFramework=${{ matrix.tfm }}

      # MinVer computes the version inside a build target, so it can only be read after one has run;
      # invoking the target directly is much cheaper than a full build.
      - name: Resolve version (MinVer)
        id: version
        shell: bash
        run: >
          echo "value=$(dotnet msbuild samples/YandexMusic.Player/YandexMusic.Player.csproj
          -t:MinVer -getProperty:Version -p:Configuration=Release
          -p:PlayerTargetFramework=${{ matrix.tfm }} -v:q -nologo | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Publish (${{ matrix.rid }}, self-contained, single file)
        run: >
          dotnet publish samples/YandexMusic.Player/YandexMusic.Player.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true
          -p:PlayerTargetFramework=${{ matrix.tfm }} -o publish/player

      # Windows ships a zip; Linux a tar.gz, so the executable bit survives packaging.
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'.Split('+')[0]
          if ('${{ matrix.rid }}' -eq 'win-x64') {
            $archive = "yandexmusic-player-$version-win-x64.zip"
            Compress-Archive -Path publish/player/* -DestinationPath $archive
          }
          else {
            $archive = "yandexmusic-player-$version-linux-x64.tar.gz"
            tar -czf $archive -C publish/player .
          }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload player artifact
        uses: actions/upload-artifact@v7
        with:
          name: yandexmusic-player-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
